# ===========================================================================
# Ravix backend configuration
# All datasource values are overridable via environment variables so the same
# build runs unchanged on the Debian test machine.
# ===========================================================================

quarkus.application.name=ravix
# Bind to loopback by default — the panel sits behind Nginx. Override with
# RAVIX_HTTP_HOST=0.0.0.0 only if you intentionally expose the API directly.
quarkus.http.port=${RAVIX_HTTP_PORT:8080}
quarkus.http.host=${RAVIX_HTTP_HOST:127.0.0.1}

# Public HTTPS port nginx serves the panel on (not 80/443). Overridable.
ravix.panel-port=${RAVIX_PANEL_PORT:9162}

# --- Datasource: local PostgreSQL on :54322, user postgres, no password ------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${RAVIX_DB_USER:postgres}
quarkus.datasource.password=${RAVIX_DB_PASSWORD:}
quarkus.datasource.jdbc.url=${RAVIX_DB_URL:jdbc:postgresql://localhost:54322/postgres}

# --- Schema: everything lives in a dedicated "ravix" schema -----------------
quarkus.hibernate-orm.database.default-schema=ravix

# --- Hibernate ORM ----------------------------------------------------------
# Schema is owned by Flyway migrations; Hibernate only validates against it.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# --- Flyway: create the schema + run all migrations on startup --------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.create-schemas=true
quarkus.flyway.schemas=ravix
quarkus.flyway.default-schema=ravix
quarkus.flyway.locations=db/migration

# --- CORS -------------------------------------------------------------------
# Handled by sh.ravix.auth.CorsFilter, not by Quarkus. The built-in filter can
# only match a static allow-list, and the panel's own origin differs on every
# install (IP vs hostname, custom port) — configuring it wrong locks the
# operator out. CorsFilter always allows same-origin (the production shape) and
# restricts genuine cross-origin callers to the list below.
quarkus.http.cors=false
ravix.cors.origins=${RAVIX_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- OpenAPI / Swagger UI ---------------------------------------------------
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.path=/api/swagger
quarkus.swagger-ui.always-include=true

# --- First-run admin account (created if no admins exist) -------------------
# Leave the password empty and Ravix generates a random one, printing it once
# at startup. Never ship a fixed default here — see AuthService.onStart.
ravix.admin.email=${RAVIX_ADMIN_EMAIL:admin@example.com}
ravix.admin.password=${RAVIX_ADMIN_PASSWORD:}

# --- Login throttling (brute-force protection on /api/auth/login) -----------
ravix.auth.max-failures=${RAVIX_AUTH_MAX_FAILURES:5}
ravix.auth.max-failures-per-ip=${RAVIX_AUTH_MAX_FAILURES_PER_IP:20}
ravix.auth.window-seconds=${RAVIX_AUTH_WINDOW_SECONDS:300}
ravix.auth.lockout-seconds=${RAVIX_AUTH_LOCKOUT_SECONDS:900}

# --- Result-set caps --------------------------------------------------------
# Upper bound on how many Postfix queue entries are parsed into memory in one
# request. A queue deeper than this is itself the incident; the panel shows the
# newest slice and the summary counters stay exact.
ravix.queue.max-items=${RAVIX_QUEUE_MAX_ITEMS:500}

# --- Mail stack paths (overridable on the target host) ----------------------
ravix.paths.config=${RAVIX_PATH_CONFIG:/etc/ravix}
ravix.paths.data=${RAVIX_PATH_DATA:/var/lib/ravix}
ravix.log.postfix=${RAVIX_LOG_POSTFIX:/var/log/mail.log}
ravix.log.dovecot=${RAVIX_LOG_DOVECOT:/var/log/mail.log}
ravix.log.rspamd=${RAVIX_LOG_RSPAMD:/var/log/rspamd/rspamd.log}
ravix.log.nginx=${RAVIX_LOG_NGINX:/var/log/nginx/access.log}
ravix.log.ravix=${RAVIX_LOG_RAVIX:/var/log/ravix/ravix.log}

# --- Provisioning: where Ravix renders mail-stack config (overridable) ------
ravix.provision.postfix-dir=${RAVIX_POSTFIX_DIR:/etc/postfix/ravix}
ravix.provision.dovecot-userfile=${RAVIX_DOVECOT_USERFILE:/etc/dovecot/ravix-users}
ravix.provision.dkim-dir=${RAVIX_DKIM_DIR:/etc/opendkim}
ravix.provision.rspamd-dir=${RAVIX_RSPAMD_DIR:/etc/rspamd/local.d}
ravix.provision.vmail-base=${RAVIX_VMAIL_BASE:/var/vmail}
ravix.provision.vmail-uid=${RAVIX_VMAIL_UID:5000}
ravix.provision.vmail-gid=${RAVIX_VMAIL_GID:5000}

# --- DMARC aggregate-report inbox (files dropped here are auto-ingested) -----
ravix.dmarc.inbox=${RAVIX_DMARC_INBOX:/var/lib/ravix/dmarc/inbox}

# --- FBL (feedback-loop / ARF) complaint inbox ------------------------------
ravix.fbl.inbox=${RAVIX_FBL_INBOX:/var/lib/ravix/fbl/inbox}

# --- JNDI ------------------------------------------------------------------
# Quarkus disables JNDI by default (security hardening). We need it to be on
# because our DNS lookups (DomainChecker, MtaStsService, RblService) use the
# JDK's built-in DNS provider (com.sun.jndi.dns.DnsContextFactory). Without
# this flag every DNS check silently returns empty.
quarkus.naming.enable-jndi=true

# --- Logging ----------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."sh.ravix".level=DEBUG
