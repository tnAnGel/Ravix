# --- Test profile ----------------------------------------------------------
# The datasource URL/credentials are supplied at runtime by PostgresResource
# (a throwaway Testcontainers PostgreSQL), which overrides these. Flyway runs
# the real migrations against that fresh DB, then Hibernate validates.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=false
quarkus.hibernate-orm.database.generation=validate

# Keep the background mail-sync scheduler out of the way during tests.
quarkus.scheduler.enabled=false

# Deterministic admin for auth integration tests.
ravix.admin.email=admin@example.com
ravix.admin.password=ravix-admin

# Quiet, predictable logs.
quarkus.log.level=WARN
quarkus.log.category."sh.ravix".level=INFO
quarkus.hibernate-orm.log.sql=false
